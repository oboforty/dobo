[tool.poetry]
name = "DoboApi"
version = "0.1.0"
description = "Write-optimized database"
authors = [

]
maintainers = [

]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.100.0"
pydantic = "^2"
pydantic-settings = "^2"
ujson = "^5.8.0"

# AIO
uvicorn = { version = "^0.22.0", extras = ["standard"] }
aiofiles = "^23.1.0"
httpx = "^0.23.3"
httpx-oauth = "^0.10.2"
httptools = "^0.6.0"

aiosqlite = {version = "^0.20.0"}
SQLAlchemy = {version = "^2.0.18", extras = ["asyncio"]}
alembic = "^1.11.1"
# Mail
boto3 = "^1.34.125"

dobodb = {path = "../dobodb", develop = true}

#[tool.poetry.extras]

[tool.poetry.dev-dependencies]
pytest = "^7.2.1"
anyio = "^3.6.2"
#flake8 = "~4.0.1"
#mypy = "^1.1.1"
#isort = "^5.11.4"
#pre-commit = "^3.0.1"
#wemake-python-styleguide = "^0.17.0"
#black = "^22.12.0"
#autoflake = "^1.6.1"
#pytest-cov = "^4.0.0"
#pytest-env = "^0.8.1"

#[tool.isort]
#profile = "black"
#multi_line_output = 3
#src_paths = ["DoboApi",]

#[tool.mypy]
#strict = true
#ignore_missing_imports = true
#allow_subclassing_any = true
#allow_untyped_calls = true
#pretty = true
#show_error_codes = true
#implicit_reexport = true
#allow_untyped_decorators = true
#warn_unused_ignores = false
#warn_return_any = false
#namespace_packages = true

[tool.pytest.ini_options]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore:.*unclosed.*:ResourceWarning",
]
#env = [
#    "DoboApi_ENVIRONMENT=pytest",
#    "DoboApi_DB_BASE=DoboApi_test",
#]

[fastapi-template.options]
project_name = "DoboApi"
api_type = "rest"
enable_redis = "None"
enable_rmq = "None"
ci_type = "none"
enable_migrations = "True"
enable_taskiq = "None"
enable_kube = "None"
kube_name = "DoboApi"
enable_routers = "True"
enable_kafka = "None"
enable_loguru = "None"
traefik_labels = "None"
orm = "sqlalchemy"
self_hosted_swagger = "True"
prometheus_enabled = "None"
sentry_enabled = "None"
otlp_enabled = "None"
pydanticv1 = "None"
gunicorn = "None"
add_users = "True"
cookie_auth = "True"
jwt_auth = "True"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
